{% extends "app01/layout.html" %}
{% load static %}

{% block title %}修改部门{% endblock %}

{% block content %}
<div class="panel panel-default">
    <div class="panel-heading">
        <h3 class="panel-title">修改部门</h3>
    </div>
    <div class="panel-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>标题</label>
                <input id="titleInput" type="text" class="form-control" placeholder="标题" name="title" value="{{ row_object.title }}" autofocus/>
            </div>
            <button type="submit" class="btn btn-primary">提 交</button>
        </form>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
// 光标自动定位到输入框文字末尾
var input = document.getElementById("titleInput");
input.focus();
input.setSelectionRange(input.value.length, input.value.length);
</script>
{% endblock %}
